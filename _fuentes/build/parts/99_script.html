const $ = (s, r) => (r || document).querySelector(s);

function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function el(tag, attrs, html) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) { if (k === "class") e.className = attrs[k]; else e.setAttribute(k, attrs[k]); }

}
/* [[código]] dentro de un texto -> <code> */
function rico(s) { return esc(s).replace(/\[\[(.+?)\]\](?!\])/g, "<code>$1</code>"); }
function escAttr(s) { return esc(s).replace(/"/g, "&quot;"); }

/* ------------------------------------------------------- resaltado de Mizar */
const PALABRAS = new Set(("environ begin vocabularies notations constructors registrations requirements definitions " +
  "equalities expansions theorems schemes reserve for being be st holds ex implies iff not or contradiction thesis " +
  "theorem proof end let assume that and thus hence then take consider such per cases suppose case hereby now " +
  "reconsider as set defpred deffunc means equals definition registration cluster coherence existence uniqueness " +
  "func pred attr mode struct redefine notation synonym antonym scheme provided from by is of it where qua the " +
  "reflexivity symmetry commutativity irreflexivity asymmetry connectedness idempotence involutiveness given if " +
  "otherwise non").split(" "));
function resaltar(src) {
  return src.split("\n").map(linea => {
    const i = linea.indexOf("::");
    let cod = i >= 0 ? linea.slice(0, i) : linea;
    const com = i >= 0 ? linea.slice(i) : "";
    let out = "";
    const m = cod.match(/^(\s*)(:?[A-Za-z][A-Za-z0-9_']*:)(?=\s|$)/);
    if (m && !/^\s*(theorem|scheme)\b/.test(cod)) { out += m[1] + '<span class="l">' + esc(m[2]) + "</span>"; cod = cod.slice(m[0].length); }
    const re = /([A-Z][A-Z0-9_]*:(?:def |sch )?\d+)|([A-Za-z_][A-Za-z0-9_']*)|(\s+)|([^A-Za-z_\s]+)/g;
    let t;
    while ((t = re.exec(cod))) {
      if (t[1]) out += '<span class="r">' + esc(t[1]) + "</span>";
      else if (t[2]) out += PALABRAS.has(t[2]) ? '<span class="k">' + t[2] + "</span>" : esc(t[2]);
      else out += esc(t[0]);
    }
    if (com) out += '<span class="c">' + esc(com) + "</span>";
    return out;
  }).join("\n");
}
function bloque(src) {
  const d = el("div", { class: "bloque" });
  const p = el("pre", { class: "miz" });
  p.dataset.src = src; p.innerHTML = resaltar(src);
  d.appendChild(p); ponerCopiar(d);
  return d;
}
function ponerCopiar(d) {
  const pre = $("pre", d);
  const b = el("button", { type: "button", class: "copiar" }, "Copiar");
  b.addEventListener("click", () => {
    const txt = pre.dataset.src != null ? pre.dataset.src : pre.textContent;
    const ok = () => { b.textContent = "Copiado"; setTimeout(() => (b.textContent = "Copiar"), 1400); };
    const plan = () => { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, plan); else plan();
  });
  d.appendChild(b);
}

function consignaHTML(t) {
  return esc(t).replace(/"([^"]+)"/g, (m, x) =>
    /[áéíóúñ¿]|(^|\s)(si|entonces|existe|para todo|no todo|todo|equivale)(\s|$)/i.test(x) ? "«" + x + "»" : "<code class=\"l\">" + x + "</code>");
}
function listaErrores(errs) {

function pintarPractica(caja) {

function tarjeta(arch, x) {
  const clave = arch + ":" + x.id, idc = "ej-" + arch + "-" + x.id;
  const t = el("div", { class: "ej" + (estado.hechos[clave] ? " hecho" : "") });
  const cab = el("div", { class: "ej-cab" });
  cab.innerHTML = '<label for="' + idc + '"><input type="checkbox" id="' + idc + '"' + (estado.hechos[clave] ? " checked" : "") +
    "> Ejercicio " + esc(x.id) + '</label><span class="donde">renglón ' + x.linea + "</span>";
  t.appendChild(cab);
  $("input", cab).addEventListener("change", ev => {
    if (ev.target.checked) estado.hechos[clave] = 1; else delete estado.hechos[clave];
    t.classList.toggle("hecho", ev.target.checked); guardar(); pintarAvance();
  });
  t.appendChild(el("p", null, consignaHTML(x.consigna)));
  if (x.sint.length) t.appendChild(el("div", { class: "sintoma" }, "Mientras siga sin resolver, Mizar dirá: " +
    x.sint.map(s => '<span class="chip' + (s.cod >= 600 && s.cod < 800 ? " util" : "") + '" title="' + escAttr(s.msg) + '">*' + s.cod + "</span>").join(" ")));
  const bot = el("div", { class: "ej-bot" });
  const lp = el("ul", { class: "pistas" }); lp.hidden = true;
  let dadas = 0;
  if (x.pistas.length) {
    const bp = el("button", { type: "button", class: "btn" }, "Pista");
    bp.addEventListener("click", () => {
      if (dadas < x.pistas.length) {
        lp.hidden = false;
        lp.appendChild(el("li", null, "<b>Pista " + (dadas + 1) + "</b>" + x.pistas[dadas]));
        dadas++;
      }
      if (dadas >= x.pistas.length) { bp.disabled = true; bp.textContent = "No hay más pistas"; }
      else bp.textContent = "Otra pista (" + dadas + " de " + x.pistas.length + ")";
    });
    bot.appendChild(bp);
  }
  const sol = el("div", { class: "solucion" }); sol.hidden = true;
  const bs = el("button", { type: "button", class: "btn" }, "Ver solución");
  bs.addEventListener("click", () => {
    if (!sol.childNodes.length) {
      if (x.alt && x.alt.trim()) { sol.appendChild(el("p", { class: "rot" }, x.sol.trim() ? "En lugar de" : "Borra")); sol.appendChild(bloque(x.alt)); }
      if (x.sol.trim()) { sol.appendChild(el("p", { class: "rot" }, x.rot ? esc(x.rot) : x.alt && x.alt.trim() ? "debe quedar" : "Hay que escribir")); sol.appendChild(bloque(x.sol)); }
    }
    sol.hidden = !sol.hidden; bs.textContent = sol.hidden ? "Ver solución" : "Ocultar solución";
  });
  bot.appendChild(bs);
  t.appendChild(bot); t.appendChild(lp); t.appendChild(sol);
  return t;
}

function pintarQuiz(caja) {
  const q = QUIZ[caja.dataset.id]; if (!q) return;
  caja.appendChild(el("div", { class: "preg" }, rico(q.p)));
  const ops = el("div", { class: "ops" }), exp = el("p", { class: "exp" }); exp.hidden = true;
  q.o.forEach((txt, i) => {
    const b = el("button", { type: "button" }, rico(txt));
    b.addEventListener("click", () => {
      $$("button", ops).forEach((x, j) => { x.disabled = true; if (j === q.ok) x.classList.add("ok"); });
      if (i !== q.ok) b.classList.add("no");
      exp.innerHTML = (i === q.ok ? "<strong>Correcto.</strong> " : "<strong>No.</strong> ") + rico(q.e); exp.hidden = false;
    });
    ops.appendChild(b);
  });
  caja.appendChild(ops); caja.appendChild(exp);
}

      { l: [18, 19], t: null, s: ["A1: for x holds f.x = 2*x + 1", "eps es un real fijo, arbitrario", "A2: 0 < eps", "delta = eps/2", "x es un real fijo, arbitrario", "A3: |.x - c.| < delta", "f.x = 2*x + 1 & f.c = 2*c + 1", "|.f.x - f.c.| = 2*|.x - c.|", "|.f.x - f.c.| < 2*delta"],
        n: "2*delta es eps: eso es aritmética y el verificador lo ve solo." }
    ]
  }
};
function pintarPasos(caja) {
  const d = PASOS[caja.dataset.id]; if (!d) return;
  let k = 0;
  const cab = el("div", { class: "pasos-cab" }, "<b>" + esc(d.titulo) + '</b><span class="cuenta"></span>');
  const bAnt = el("button", { type: "button", class: "btn" }, "Anterior");
  const bSig = el("button", { type: "button", class: "btn pral" }, "Siguiente paso");
  cab.appendChild(bAnt); cab.appendChild(bSig);
  const cuerpo = el("div", { class: "pasos-cuerpo" });
  const cod = el("div", { class: "pasos-cod" });
  d.cod.forEach(l => cod.appendChild(el("div", null, resaltar(l) || " ")));
  const est = el("div", { class: "pasos-est" });
  cuerpo.appendChild(cod); cuerpo.appendChild(est);
  caja.appendChild(cab); caja.appendChild(cuerpo);
  function pintar() {
    const p = d.pasos[k], previo = k > 0 ? d.pasos[k - 1].s : [];
    $$("div", cod).forEach((x, i) => { x.className = i >= p.l[0] && i <= p.l[1] ? "ahora" : i < p.l[0] ? "visto" : ""; });
    est.innerHTML = "<h4>Tesis: lo que falta demostrar</h4>" +
      (p.t ? '<div class="tesis">' + esc(p.t) + "</div>" : '<div class="tesis fin">nada: demostrado</div>') +
      "<h4>Lo que se sabe</h4><ul>" + (p.s.length ? p.s.map(x => '<li class="' + (previo.indexOf(x) < 0 ? "nuevo" : "") + '">' + esc(x) + "</li>").join("") : "<li>(nada todavía)</li>") + "</ul>" +
      '<p class="expl">' + esc(p.n) + "</p>";
    $(".cuenta", cab).textContent = "paso " + (k + 1) + " de " + d.pasos.length;
    bAnt.disabled = k === 0;
    bSig.textContent = k === d.pasos.length - 1 ? "Volver al principio" : "Siguiente paso";
  }
  bAnt.addEventListener("click", () => { if (k > 0) { k--; pintar(); } });
  bSig.addEventListener("click", () => { k = k === d.pasos.length - 1 ? 0 : k + 1; pintar(); });
  pintar();
}

/* --------------------------------------------------- traductor de fórmulas */
const TRAD = [
  ["¬φ ⇔ ¬¬¬φ", "not A iff not not not A"],
  ["¬(φ ∨ ψ) ⇒ (¬φ ∧ ¬ψ)", "not (A or B) implies not A & not B"],
  ["(φ ⇒ ψ) ⇒ θ", "(A implies B) implies C"],
  ["φ ∧ (ψ ∨ θ)", "A & (B or C)"],
  ["(φ ∧ ψ) ∨ θ ⇔ (φ ∨ θ) ∧ (ψ ∨ θ)", "A & B or C iff (A or C) & (B or C)"]
];
function analizar(txt) {
  const toks = txt.match(/\(|\)|&|[A-Za-z_]+|\S/g) || [];
  let i = 0;
  const ver = () => toks[i];
  function atomo() {
    const t = toks[i++];
    if (t === undefined) throw "la fórmula termina antes de tiempo";
    if (t === "not") return ["not", atomo()];
    if (t === "(") { const f = formula(); if (toks[i++] !== ")") throw "falta cerrar un paréntesis"; return f; }
    if (t === "contradiction") return ["c"];
    if (/^[A-C]$/.test(t)) return ["v", t];
    if (/^(and|y|o|no|implica|si)$/i.test(t)) throw "«" + t + "» no es Mizar: los conectivos son not, &, or, implies, iff";
    throw "no se esperaba «" + t + "» (usa las letras A, B, C)";
  }
  function conj() { let a = atomo(); while (ver() === "&") { i++; a = ["&", a, atomo()]; } return a; }
  function disy() { let a = conj(); while (ver() === "or") { i++; a = ["or", a, conj()]; } return a; }
  function formula() {
    const a = disy();
    if (ver() === "implies" || ver() === "iff") {
      const op = toks[i++], b = disy();
      if (ver() === "implies" || ver() === "iff") throw "implies e iff no se encadenan sin paréntesis (error *336)";
      return [op, a, b];
    }
    return a;
  }
  const f = formula();
  if (i < toks.length) throw "sobra «" + toks[i] + "»";
  return f;
}
function mostrar(f, tope) {
  if (f[0] === "v") return f[1];
  if (f[0] === "c") return "contradiction";
  const s = f[0] === "not" ? "not " + mostrar(f[1]) : mostrar(f[1]) + " " + f[0] + " " + mostrar(f[2]);
  return tope ? s : "(" + s + ")";
}
function valor(f, v) {
  switch (f[0]) {
    case "v": return v[f[1]];
    case "c": return false;
    case "not": return !valor(f[1], v);
    case "&": return valor(f[1], v) && valor(f[2], v);
    case "or": return valor(f[1], v) || valor(f[2], v);
    case "implies": return !valor(f[1], v) || valor(f[2], v);
    default: return valor(f[1], v) === valor(f[2], v);
  }
}
function equivalentes(f, g) {
  for (let m = 0; m < 8; m++) { const v = { A: !!(m & 1), B: !!(m & 2), C: !!(m & 4) }; if (valor(f, v) !== valor(g, v)) return false; }
  return true;
}
function pintarTrad(caja) {
  TRAD.forEach((it, n) => {
    const d = el("div", { class: "trad-item" });
    d.appendChild(el("div", { class: "formula" }, esc(it[0])));
    const fila = el("div", { class: "fila" });
    const inp = el("input", { type: "text", id: "trad-" + n, autocomplete: "off", spellcheck: "false", placeholder: "escribe la fórmula en Mizar", "aria-label": "Traducción de " + it[0] });
    const b = el("button", { type: "button", class: "btn pral" }, "Comprobar");
    const b2 = el("button", { type: "button", class: "btn" }, "Ver respuesta");
    const r = el("div", { class: "resp" }); r.hidden = true;
    const comprobar = () => {
      r.hidden = false;
      if (!inp.value.trim()) { r.className = "resp no"; r.textContent = "Escribe una fórmula."; return; }
      try {
        const f = analizar(inp.value), g = analizar(it[1]);
        const lee = "Mizar lo lee así: <code class=\"l\">" + esc(mostrar(f, true)) + "</code>";
        if (JSON.stringify(f) === JSON.stringify(g)) { r.className = "resp ok"; r.innerHTML = "Correcto. " + lee; }
        else if (equivalentes(f, g)) { r.className = "resp no"; r.innerHTML = "Es lógicamente equivalente, pero no es la traducción literal. " + lee; }
        else { r.className = "resp no"; r.innerHTML = "No dice lo mismo. " + lee + ". Revisa los conectivos y los paréntesis."; }
      } catch (e) { r.className = "resp no"; r.textContent = "No se puede analizar: " + e + "."; }
    };
    b.addEventListener("click", comprobar);
    inp.addEventListener("keydown", ev => { if (ev.key === "Enter") comprobar(); });
    b2.addEventListener("click", () => { r.hidden = false; r.className = "resp"; r.innerHTML = "Una respuesta: <code class=\"l\">" + esc(it[1]) + "</code>"; });
    fila.appendChild(inp); fila.appendChild(b); fila.appendChild(b2);
    d.appendChild(fila); d.appendChild(r); caja.appendChild(d);
  });
}

/* ------------------------------------------------------ tabla de errores */
function pintarErrores() {
  const tb = $("#tabla-err tbody");
  ERRORES.forEach(e => {
    const tr = el("tr", null, '<td><span class="chip' + (e[0] >= 600 && e[0] < 800 ? " util" : "") + '">*' + e[0] + "</span></td><td>" + e[2] +
      '<span class="en">' + esc(e[1]) + "</span></td><td>" + e[3] + "</td>");
    tr.dataset.txt = (e[0] + " " + e[1] + " " + e[2] + " " + e[3]).toLowerCase().replace(/<[^>]+>/g, "");
    tb.appendChild(tr);
  });
  $("#busca-err").addEventListener("input", ev => {
    const q = ev.target.value.trim().toLowerCase().replace(/^\*/, "");
    let n = 0;
    $$("tr", tb).forEach(tr => { const ver = !q || tr.dataset.txt.indexOf(q) >= 0; tr.hidden = !ver; if (ver) n++; });
    $("#err-vacio").hidden = n > 0;
  });
}

/* ------------------------------------------------------------ índice y avance */
function cuenta(archs) {
  let tot = 0, he = 0;
  archs.forEach(a => (DATOS[a] ? DATOS[a].ejercicios : []).forEach(x => { tot++; if (estado.hechos[a + ":" + x.id]) he++; }));
  return [he, tot];
}
function pintarIndice() {
  const cont = $("#indice-listas");
  GRUPOS.forEach(g => {
    cont.appendChild(el("h2", null, g[0]));
    const ul = el("ul");
    g[1].forEach(v => ul.appendChild(el("li", null, '<a href="#' + v[0] + '" data-vista="' + v[0] + '"><span class="num">' + v[1] +
      '</span><span class="tit">' + v[2] + '</span><span class="av"></span></a>')));
    cont.appendChild(ul);
  });
}
function pintarAvance() {
  let tot = 0, he = 0;
  VISTAS.forEach(v => {
    const c = cuenta(v[3]); tot += c[1]; he += c[0];
    const s = $('#indice a[data-vista="' + v[0] + '"] .av');
    if (s && c[1]) { s.textContent = c[0] === c[1] ? "✓" : c[0] + "/" + c[1]; s.classList.toggle("listo", c[0] === c[1]); }
  });
  $("#av-texto").textContent = he + " de " + tot + " ejercicios";
  $("#av-barra").style.width = (tot ? (100 * he) / tot : 0) + "%";
  $("#movil-av").textContent = he + "/" + tot;
}

/* ------------------------------------------------------------------ rutas */
function mostrarVista() {
  let id = (location.hash || "#inicio").slice(1);
  if (!document.getElementById("v-" + id)) id = "inicio";
  $$(".vista").forEach(s => (s.hidden = s.id !== "v-" + id));
  $$("#indice a[data-vista]").forEach(a => { if (a.dataset.vista === id) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  const i = VISTAS.findIndex(v => v[0] === id), v = VISTAS[i];
  document.title = (id === "inicio" ? "" : (v[1] ? "Lección " + v[1] + " · " : "") + v[2] + " · ") + "Mizar paso a paso";
  $("#movil-titulo").textContent = v[1] ? v[1] + ". " + v[2] : v[2];
  $("#indice").classList.remove("abierto"); $("#btn-menu").setAttribute("aria-expanded", "false");
  window.scrollTo(0, 0);
}
function ponerPies() {
  VISTAS.forEach((v, i) => {
    const s = document.getElementById("v-" + v[0]); if (!s) return;
    const pie = el("nav", { class: "pie", "aria-label": "Lección anterior y siguiente" });
    const nom = x => (x[1] ? x[1] + ". " : "") + x[2];
    if (i > 0) pie.appendChild(el("a", { href: "#" + VISTAS[i - 1][0] }, "<small>Anterior</small>" + nom(VISTAS[i - 1])));
    if (i < VISTAS.length - 1) pie.appendChild(el("a", { href: "#" + VISTAS[i + 1][0], class: "sig" }, "<small>Siguiente</small>" + nom(VISTAS[i + 1])));
    s.appendChild(pie);
  });
}

/* ------------------------------------------------------------------- tema */
function aplicarTema() {
  const t = estado.tema;
  if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t);
  $("#btn-tema").textContent = t === "auto" ? "Automático" : t === "light" ? "Claro" : "Oscuro";
}

$$("pre.miz").forEach(p => { p.dataset.src = p.textContent; p.innerHTML = resaltar(p.textContent); ponerCopiar(p.parentNode); });

$("#btn-reinicio-si").addEventListener("click", () => {
